server.address=127.0.0.1
server.port=8790
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.cache.period=0
tool.data-dir=${TOOL_DATA_DIR:./data}
logging.level.root=WARN
logging.level.cn.bank.devtool=INFO
server.error.include-message=never

logging.level.org.apache.http=OFF

spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.deserialization.use-big-decimal-for-floats=true
